name: CI

on:
  push:
  pull_request:

jobs:
  build-api:
    name: Build API image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t ragpipeline-api:${{ github.sha }} ./api

  build-ui:
    name: Build UI image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build UI image
        run: docker build -t ragpipeline-ui:${{ github.sha }} ./ui

  check-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check compose file
        run: docker compose config
