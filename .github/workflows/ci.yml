name: RAG Pipeline CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test-api:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore ./api

    - name: Build API
      run: dotnet build ./api --no-restore -c Release

    - name: Run Unit Tests
      run: dotnet test ./api --no-build --verbosity normal -c Release

  build-ui:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      working-directory: ./ui
      run: npm install

    - name: Build UI
      working-directory: ./ui
      run: npm run build

  publish-docker-images:
    needs: [build-and-test-api, build-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push API Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./api
        push: true
        provenance: false
        tags: ghcr.io/nikhilchauhan0134/ragpipeline-api:latest

    - name: Build and Push UI Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./ui
        push: true
        provenance: false
        tags: ghcr.io/nikhilchauhan0134/ragpipeline-ui:latest
